spring.application.name=mcp-server-banco

# ---------------------------------------------------------------
# Servidor MCP (transporte stdio para Claude Desktop)
# ---------------------------------------------------------------
spring.ai.mcp.server.name=banco-tdea-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
spring.ai.mcp.server.instructions=Servidor del Banco TdeA. Permite registrar clientes, abrir cuentas, consignar, retirar, transferir dinero entre cuentas y gestionar solicitudes de credito. Los montos estan en pesos colombianos (COP).

# Con stdio, la salida estandar es el canal del protocolo:
# sin servidor web, sin banner y sin logs en consola.
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.threshold.console=OFF

# ---------------------------------------------------------------
# Base de datos H2 en archivo.
# Se usa una ruta absoluta (carpeta del usuario) porque Claude Desktop
# lanza el JAR desde un directorio de trabajo que no controlamos.
# Se puede cambiar con la variable de entorno BANCO_DATA_DIR.
# AUTO_SERVER=TRUE permite abrir la BD desde varios procesos a la vez
# (por ejemplo Claude Desktop y MCP Inspector).
# ---------------------------------------------------------------
banco.data-dir=${BANCO_DATA_DIR:${user.home}/mcp-banco}
spring.datasource.url=jdbc:h2:file:${banco.data-dir}/bancodb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# schema.sql crea las tablas y data.sql carga clientes/cuentas de ejemplo
# (solo si no existen). Se ejecutan antes de que el servidor MCP atienda peticiones.

# Credito: tasa mensual y relacion cuota/ingresos maxima
banco.credito.tasa-mensual=0.0150
banco.credito.max-relacion-cuota-ingreso=0.40

# Log en archivo para depuracion
logging.file.name=${banco.data-dir}/mcp-server-banco.log
